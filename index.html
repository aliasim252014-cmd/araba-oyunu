<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Online Race</title>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background:#222;
  color:white;
  font-family:Arial;
  text-align:center;
}

#game {
  width:300px;
  height:500px;
  margin:auto;
  background:#444;
  position:relative;
  overflow:hidden;
  border:2px solid white;
}

.car {
  width:40px;
  height:60px;
  background:red;
  position:absolute;
  bottom:0;
}

.other {
  width:40px;
  height:60px;
  background:blue;
  position:absolute;
}

#chat {
  height:120px;
  overflow:auto;
  background:#111;
  font-size:12px;
  text-align:left;
  padding:5px;
}

#fps {
  position:fixed;
  top:10px;
  right:10px;
  background:black;
  color:lime;
  padding:5px 10px;
  font-size:14px;
}
</style>
</head>
<body>

<div id="fps">FPS: 0</div>

<h2>🏁 SILENT ONLINE RACE</h2>

<button onclick="login()">Google Giriş</button>
<p id="info"></p>

<div id="game">
  <div id="car"></div>
</div>

<div id="chat"></div>

<input id="msg" placeholder="mesaj yaz">
<button onclick="sendMsg()">Gönder</button>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user;
let roomId = prompt("Oda adı yaz:");
const room = db.collection("rooms").doc(roomId);

// 🔑 LOGIN
function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

// 👤 USER STATE
auth.onAuthStateChanged(u=>{
  if(!u) return;

  user = u;
  document.getElementById("info").innerText = u.displayName;

  join();
  listenPlayers();
  listenChat();
});

// 🚗 JOIN ROOM
function join(){
  room.collection("players").doc(user.uid).set({
    name:user.displayName,
    x:120,
    y:0
  });
}

// 🚗 MOVEMENT (SES YOK)
let x=120;
let y=0;
let nitro=false;

document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowLeft") x-=10;
  if(e.key==="ArrowRight") x+=10;
  if(e.key==="ArrowUp") y+=nitro?20:10;

  if(e.key==="Shift"){
    nitro=true;
    setTimeout(()=>nitro=false,2000);
  }

  update();
  checkFinish();
});

// 🚗 UPDATE PLAYER
function update(){
  if(!user) return;

  room.collection("players").doc(user.uid).set({
    name:user.displayName,
    x,y
  });
}

// 🏁 FINISH SYSTEM
function checkFinish(){
  if(y>=450){
    room.collection("finished").doc(user.uid).set({
      name:user.displayName,
      time:Date.now()
    });

    room.collection("chat").add({
      name:"SYSTEM",
      text:user.displayName+" kazandı 🏁"
    });
  }
}

// 👥 PLAYERS LISTENER
function listenPlayers(){
  room.collection("players")
  .onSnapshot(snap=>{
    document.querySelectorAll(".other").forEach(e=>e.remove());

    snap.forEach(d=>{
      if(d.id===user.uid) return;

      let p=d.data();
      let div=document.createElement("div");
      div.className="other";
      div.style.left=p.x+"px";
      div.style.bottom=p.y+"px";
      document.body.appendChild(div);
    });
  });
}

// 💬 CHAT SEND
function sendMsg(){
  room.collection("chat").add({
    name:user.displayName,
    text:document.getElementById("msg").value
  });
}

// 💬 CHAT LISTENER
function listenChat(){
  room.collection("chat")
  .onSnapshot(snap=>{
    let c=document.getElementById("chat");
    c.innerHTML="";

    snap.forEach(d=>{
      let m=d.data();
      c.innerHTML+=`<div><b>${m.name}:</b> ${m.text}</div>`;
    });
  });
}
</script>

<script>
// 🎮 FPS COUNTER
let fps=0,last=performance.now(),frames=0;

function loop(){
  let now=performance.now();
  frames++;

  if(now-last>=1000){
    fps=frames;
    frames=0;
    last=now;
    document.getElementById("fps").innerText="FPS: "+fps;
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
