<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ONLINE RACE PRO</title>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

#game {
  width:300px;
  height:500px;
  margin:auto;
  background:#222;
  position:relative;
  overflow:hidden;
  border:2px solid #fff;
}

/* 🛣️ road */
.road-line {
  position:absolute;
  width:5px;
  height:30px;
  background:#fff3;
  left:50%;
}

/* 🚗 car */
#car {
  width:40px;
  height:60px;
  position:absolute;
  bottom:0;
  left:130px;
  background:red;
  border-radius:5px;
}

/* 👥 others */
.other {
  width:40px;
  height:60px;
  position:absolute;
  border-radius:5px;
}

/* 💬 chat */
#chat {
  height:120px;
  overflow:auto;
  background:#000;
  font-size:12px;
  text-align:left;
  padding:5px;
}

/* 🏆 leaderboard */
#board {
  background:#000;
  padding:10px;
  font-size:12px;
  margin-top:5px;
}

#fps {
  position:fixed;
  top:10px;
  right:10px;
  background:black;
  color:lime;
  padding:5px;
}
</style>
</head>
<body>

<div id="fps">FPS</div>

<h3>🏁 ONLINE RACE PRO</h3>

<button onclick="login()">Google Login</button>
<p id="info"></p>

<!-- 🎨 SKIN -->
<select id="skin" onchange="setSkin()">
  <option value="red">Kırmızı</option>
  <option value="blue">Mavi</option>
  <option value="green">Yeşil</option>
  <option value="yellow">Sarı</option>
</select>

<div id="game">
  <div id="car"></div>
</div>

<div id="chat"></div>
<input id="msg">
<button onclick="sendMsg()">Gönder</button>

<div id="board">🏆 Leaderboard</div>

<script>
// 🔥 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCtU_805TQ2wyIjsexFYoznJ2bRrb1aTQc",
  authDomain: "araba-oyunu-9cd7c.firebaseapp.com",
  projectId: "araba-oyunu-9cd7c",
  storageBucket: "araba-oyunu-9cd7c.firebasestorage.app",
  messagingSenderId: "135990124575",
  appId: "1:135990124575:web:7e442aba6ff9a71e18752a",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let user;
let x=130, y=0;
let skin="red";

let roomId = prompt("Oda adı:");
if(!roomId) roomId="default";

const room = db.collection("rooms").doc(roomId);

// 🔑 LOGIN
function login(){
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
}

// redirect
auth.getRedirectResult().catch(()=>{});

// 👤 USER
auth.onAuthStateChanged(u=>{
  if(!u) return;

  user=u;
  document.getElementById("info").innerText=u.displayName;

  join();
  listenPlayers();
  listenChat();
  listenBoard();
});

// 🚗 JOIN
function join(){
  room.collection("players").doc(user.uid).set({
    name:user.displayName,
    x,y,
    skin
  });
}

// 🎨 SKIN
function setSkin(){
  skin=document.getElementById("skin").value;
  document.getElementById("car").style.background=skin;
  update();
}

// 🚗 UPDATE (THROTTLED)
let lastUpdate=0;
function update(){
  if(!user) return;

  let now=Date.now();
  if(now-lastUpdate<100) return; // lag fix
  lastUpdate=now;

  room.collection("players").doc(user.uid).set({
    name:user.displayName,
    x,y,
    skin
  });
}

// 🎮 MOVE
document.addEventListener("keydown",(e)=>{
  if(!user) return;

  if(e.key=="ArrowLeft") x-=10;
  if(e.key=="ArrowRight") x+=10;
  if(e.key=="ArrowUp") y+=15;

  draw();
  update();
  checkFinish();
});

// 🖌️ DRAW
function draw(){
  let c=document.getElementById("car");
  c.style.left=x+"px";
  c.style.bottom=y+"px";
  c.style.background=skin;
}

// 🏁 FINISH + SCORE
function checkFinish(){
  if(y>=450){
    room.collection("finished").doc(user.uid).set({
      name:user.displayName,
      score:Date.now()-startTime
    });

    room.collection("chat").add({
      name:"SYSTEM",
      text:user.displayName+" kazandı 🏁"
    });
  }
}

let startTime=Date.now();

// 👥 PLAYERS (SMOOTH)
function listenPlayers(){
  room.collection("players")
  .onSnapshot(snap=>{

    document.querySelectorAll(".other").forEach(e=>e.remove());

    snap.forEach(d=>{
      if(d.id==user.uid) return;

      let p=d.data();

      let div=document.createElement("div");
      div.className="other";
      div.style.left=p.x+"px";
      div.style.bottom=p.y+"px";
      div.style.background=p.skin || "blue";

      document.getElementById("game").appendChild(div);
    });
  });
}

// 💬 CHAT
function sendMsg(){
  room.collection("chat").add({
    name:user.displayName,
    text:msg.value
  });
}

function listenChat(){
  room.collection("chat")
  .onSnapshot(s=>{
    chat.innerHTML="";
    s.forEach(d=>{
      let m=d.data();
      chat.innerHTML+=`<div><b>${m.name}:</b> ${m.text}</div>`;
    });
  });
}

// 🏆 LEADERBOARD
function listenBoard(){
  room.collection("finished")
  .orderBy("score","asc")
  .onSnapshot(s=>{
    board.innerHTML="🏆 Leaderboard<br>";

    s.forEach(d=>{
      let p=d.data();
      board.innerHTML+=`<div>${p.name} - ${p.score}ms</div>`;
    });
  });
}

// 🛣️ ROAD
for(let i=0;i<10;i++){
  let line=document.createElement("div");
  line.className="road-line";
  line.style.top=(i*60)+"px";
  document.getElementById("game").appendChild(line);
}

// 🎮 FPS
let fps=0,last=Date.now(),f=0;

function loop(){
  f++;
  if(Date.now()-last>1000){
    fps=f;
    f=0;
    last=Date.now();
    fps.innerText=fps;
  }
  requestAnimationFrame(loop);
}
loop();

draw();
</script>

</body>
</html>
